---
name: Semantic Version source code
run-name: PR merged by ${{ github.actor }}.  (SemVer) 🚀
on:
  push: 
   branches: 
    - main 

permissions:
  contents: write
  issues: write


jobs: 
  generate-semver-tag: 
    name: Semantic Release
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4
  
      - name: Run Semantic Release
        uses: cycjimmy/semantic-release-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}