---
name: Semantic Version & Docker Push 
run-name: PR merged by ${{ github.actor }}.  (SemVer) 🚀
on:
  push: 
   branches: 
    - main 

permissions:
  contents: write
  issues: write


jobs: 
  semver-docker-push: 
    name: Semantic Release
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout Code
        uses: actions/checkout@v4
  
      - name: Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Set RELEASE_VERSION env var
        if: steps.semantic.outputs.new_release_published == 'true'
        run: echo "RELEASE_VERSION=${{ steps.semantic.outputs.release_version }}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build & Push Docker Image
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          DOCKER_BUILDKIT=1 docker build -t jdxops-demo-app:latest .
          docker tag jdxops-demo-app:latest jdial1996/jdxops-demo-app:latest
          docker push jdial1996/jdxops-demo-app:latest

          docker tag jdxops-demo-app:latest jdial1996/jdxops-demo-app:$RELEASE_VERSION
          docker push jdial1996/jdxops-demo-app:$RELEASE_VERSION