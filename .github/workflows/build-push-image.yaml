---
name: Build & Push  Docker Image 
run-name: Docker build and push by ${{ github.actor }}. 🚀
## on pr to main 

on: 
  push: 
    tags: 
    - '*'

jobs: 
  build_and_push:
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: ./app
    steps:
      - name: Checkout Code.
        uses: actions/checkout@v4
      - name: Get Latest Tag.
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker Image
        run: 
          DOCKER_BUILDKIT=1 docker build -t jdxops-demo-app:latest .
      - name: Docker Push (DockerHub)
        run: | 
          docker push jdial1996/jdxops-demo-app:latest
          docker tag jdxops-demo-app:latest jdial1996/jdxops-demo-app:$RELEASE_VERSION
          docker push jdial1996/jdxops-demo-app:$RELEASE_VERSION